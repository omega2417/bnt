[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-sme"
version = "0.1.0"
description = "Adaptive Cybersecurity Protector for SMEs (ACP-SME): a metadata-driven, resource-aware profile-tailoring prototype for NIST CSF 2.0, ISO/IEC 27001:2022 and CIS Controls v8.1"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Dmytro Prokopovych-Tkachenko", email = "omega2417@gmail.com" },
]
keywords = [
    "cybersecurity",
    "organizational profiles",
    "control prioritization",
    "SME",
    "NIST CSF 2.0",
    "ISO/IEC 27001",
    "CIS Controls",
    "digital twins",
    "extended reality",
    "privacy by design",
    "human-in-the-loop",
    "cyber resilience",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/omega2417/bnt"

[project.scripts]
acp-sme = "acp_sme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: longer-running reproduction checks"]
