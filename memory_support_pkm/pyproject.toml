[project]
name = "pgmem"
version = "1.0.0"
description = "Provenance-governed agentic memory support: reference implementation, synthetic dataset and statistics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "tabulate>=0.9", "plotly>=5.18"]

[project.optional-dependencies]
neural = ["torch", "transformers", "sentence-transformers", "sentencepiece"]

[tool.setuptools]
packages = ["pgmem"]
