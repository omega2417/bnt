name: ci

on:
  push:
    paths:
      - "aegis-uav-5g/**"
  pull_request:
    paths:
      - "aegis-uav-5g/**"

defaults:
  run:
    working-directory: aegis-uav-5g

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy || true

      - name: Unit tests
        run: pytest --cov=aegis_uav --cov-report=term-missing

      - name: End-to-end smoke campaign
        env:
          MPLBACKEND: Agg
        run: aegis campaign --config configs/experiments/smoke.yaml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegis-artifacts-py${{ matrix.python-version }}
          path: aegis-uav-5g/artifacts
