[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bircpg"
version = "1.0.0"
description = "Reference implementation of a bio-inspired resource-constrained potential game for multi-agent task allocation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "potential games",
    "computational game theory",
    "autonomous agents",
    "resource-constrained coordination",
    "bounded rationality",
    "stigmergy",
    "Nash equilibrium",
    "bio-inspired control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The Level I core is pure standard library on purpose: the exact-arithmetic
# verification must not depend on a numerical stack.
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.5"]
notebook = ["matplotlib>=3.5", "pandas>=1.3"]
dev = ["pytest>=7.0", "matplotlib>=3.5", "pandas>=1.3"]

[project.scripts]
bircpg = "bircpg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
