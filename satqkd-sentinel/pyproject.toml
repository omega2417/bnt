[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satqkd-sentinel"
version = "2.0.0"
description = "Simulation, telemetry analytics and geostationary-backbone toolkit for satellite QKD networks with optical phased arrays"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
maps = ["basemap>=2.0", "basemap-data>=2.0"]
test = ["pytest>=8"]
notebook = ["jupyter>=1.0", "nbformat>=5.9"]
all = ["satqkd-sentinel[maps,test,notebook]"]

[tool.setuptools]
packages = ["satqkd_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
