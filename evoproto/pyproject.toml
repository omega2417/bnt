[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoproto"
version = "0.1.0"
description = "Reference implementation of the evolution-informed, evidence-gated engineering design framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Olga Torstensson" },
    { name = "Yuriy Danyk" },
    { name = "Dmytro Prokopovych-Tkachenko" },
]
keywords = [
    "biomimetic design",
    "evolutionary data",
    "knowledge graph",
    "generative design",
    "multi-objective optimization",
    "additive manufacturing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "networkx>=2.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/omega2417/bnt/tree/master/evoproto"

[project.scripts]
evoproto = "evoproto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
