[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crtm-ois"
version = "1.0.0"
description = "Staged method and agent-oriented system for the integral cyber resilience of critical infrastructure objects (CRTM-OIS)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
llm = ["anthropic>=0.80"]
notebook = ["jupyter", "nbformat", "nbclient", "ipykernel"]
dev = ["pytest"]

[project.scripts]
crtm-ois = "crtm_ois.cli:main"

[tool.setuptools.packages.find]
include = ["crtm_ois*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
