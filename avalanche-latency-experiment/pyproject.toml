[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alp"
version = "1.0.0"
description = "Reproducible field experiment on confirmed-state access latency in a permissioned Avalanche L1"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
field = ["web3>=6.15", "eth-account>=0.11"]
dev = ["pytest>=7.4"]

[project.scripts]
alp = "alp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
