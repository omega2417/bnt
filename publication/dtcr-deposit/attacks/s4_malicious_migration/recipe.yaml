scenario: S4
name: malicious_workload_migration
target:
  asset: dtcr:analytics-core
  orchestration_api: "https://cloud-01.lab:6443"
attacker:
  host: attacker.lab
  initial_privilege: "authenticated operator credential with clearance below the workload's label"
payload:
  action: "request migration of analytics-core onto edge-04 (domain d2, security_label 1)"
  request: "PATCH /apis/apps/v1/namespaces/dtcr/deployments/analytics-core (nodeSelector: edge-04)"
violation:
  workload_label: 3
  target_node_label: 1
  workload_tau: 0.75
  target_node_trust: "variable; typically below 0.75 under the campaign"
  allowed_domains: [d0]
  target_domain: d2
duration_s: 60
ground_truth_onset: "driver logs the epoch of the placement request"
success_criterion: "analytics-core runs on a node whose label/trust/domain does not admit it"
expected_defensive_action: "deny migration, revoke credentials, reschedule on an admissible node"
reset:
  - "revert the deployment to its admissible placement"
  - "revoke the run's operator credential"
  - "washout 300 s"
