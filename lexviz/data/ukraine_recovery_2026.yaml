# LexViz dataset S1
# Structured, provenance-tagged coding of Tables 1 and 2 and Section 3 of the manuscript
# "Legal Framework for Ukraine's Post-War Recovery and the EU Acquis:
#  A Comparative Analysis of Public Administration Mechanisms" (Laws, MDPI).
#
# Provenance tags:
#   L  - content of a legal act
#   EC - assessment of the European Commission
#   A  - authors' assessment
#   P  - authors' proposal
#
# Edit this file, then run:  lexviz validate <file>  and  lexviz build <file>
# (on iPad: open run_ipad.py and press Run).

meta:
  id: ukraine_recovery_2026
  title: Legal framework for Ukraine's post-war recovery and the EU acquis
  cutoff: "2026-11-20"
  version: 0.1.0
  source: Tables 1-2 and Sections 2-3 of the revised manuscript

provenance:
  L:  {label: "content of a legal act"}
  EC: {label: "assessment of the European Commission"}
  A:  {label: "authors' assessment"}
  P:  {label: "authors' proposal"}

# Commission's five-level verbal scale, coded ordinally 1..5 (Section 2.6).
ec_scale:
  - early stage
  - some level of preparation
  - moderately prepared
  - good level of preparation
  - well advanced

criteria:
  C1: Formal alignment
  C2: Scope of derogation
  C3: Enforcement
  C4: Temporal limitation

