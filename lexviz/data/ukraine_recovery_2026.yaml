mechanisms:
  institutional: Institutional
  legal: Legal and regulatory
  financial: Financial
  procedural: Procedural

problems:
  - id: fragmentation
    name: Fragmentation of the recovery legal framework
    root_cause: Accelerated, reactive law-making; dispersed legislative initiative
    mechanisms: [legal, institutional]
    tracks: [uf]
  - id: eia_exemption
    name: Exemption of restoration works from EIA
    root_cause: Wartime priority of speed over procedural completeness
    mechanisms: [legal]
    tracks: [uf, ch27]
  - id: state_aid_suspension
    name: Suspension of State aid control
    root_cause: Need for rapid support to undertakings under martial law
    mechanisms: [legal, institutional]
    tracks: [ch8]
  - id: anticorruption
    name: Instability of anti-corruption safeguards
    root_cause: Independence safeguards rest on ordinary law
    mechanisms: [legal, institutional]
    tracks: [uf, ch23]

tracks:
  uf:   "Ukraine Facility (Plan steps; Art. 5 pre-condition)"
  ch27: "Chapter 27 (environment)"
  ch8:  "Chapter 8 (State aid)"
  ch23: "Chapter 23 (anti-corruption)"

fishbone:
  effect: "Divergence of recovery legislation from the EU acquis"
  causes:
    institutional:
      - No single body coordinating recovery law-making
      - Weak vertical coordination (centre–region–community)
      - Weak interdepartmental (horizontal) cooperation
      - Unclear mandates of State Agency and Business Development Fund
    legal:
      - Accelerated, reactive wartime law-making
      - Categorical derogations (EIA, State aid)
      - Concurrent procurement regimes until 24.03.2027
      - Safeguards of NABU/SAPO in ordinary law
    financial:
      - Conditionality → risk of "decorative" compliance
      - Communities' lost revenue base
      - Gaps in the 2025 PPP law
      - Recovery aid granted without compatibility assessment
    procedural:
      - Underdeveloped monitoring and evaluation
      - Divergent damage-assessment methodologies
      - No unified register of damage
      - Limited DREAM integration with registers and finance systems

